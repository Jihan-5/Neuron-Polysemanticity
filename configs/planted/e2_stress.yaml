# E2 — assumption-stress conditions, each a delta on the clean base generator.
extends: base.yaml
experiment: e2_stress
reps: 200
dev_reps: 30
methods:
  gmm_bic: {k_max: 6, max_rows: 4000}
  fastica: {}
  jointdiag: {n_starts: 6}
  jointdiag_cum: {n_starts: 6}     # exploratory: + 4th-order cumulant slices (higher-moment info set)
  boot_percentile: {n_boot: 200}
  sensitivity: {n_restarts: 24, n_perturb: 10}
  ismb: {n_boot: 200, alpha: 0.05}
conditions:
  clean: {}
  weak_diversity: {diversity: near_collinear, collinear_eta: 0.05}
  collinear_pair: {collinear_groups: [[0, 1]]}
  collinear_triple: {collinear_groups: [[0, 1, 2]]}
  near_duplicate_columns: {near_duplicate_pairs: [[0, 1, 0.95]]}
  loadings_near_tau: {near_tau_columns: 6, near_tau_width: 0.02}
  invisible_factors: {invisible_factors: [0, 1]}
  unknown_K_8: {K: 8}
  cooccurrence_partial: {switch_corr_blocks: [[0, 1]], switch_corr: 0.5}
  cooccurrence_perfect: {switch_corr_blocks: [[0, 1]], switch_corr: 1.0}
  coupled_magnitudes: {magnitude_corr_blocks: [[2, 3]], magnitude_corr: 0.8}
  noise_correlated_stationary: {noise_mode: correlated_stationary, noise_rel_sd: 0.2}
  noise_env_scaled: {noise_mode: env_scaled, noise_rel_sd: 0.2}
  noise_env_heteroscedastic: {noise_mode: env_heteroscedastic, noise_rel_sd: 0.2}
  noise_student_t: {noise_mode: student_t, noise_rel_sd: 0.2}
  few_envs_3: {n_envs: 3}
  few_envs_4: {n_envs: 4}
  many_envs_8: {n_envs: 8}
  overcomplete_24: {K: 24, max_cond: 1.0e9}
