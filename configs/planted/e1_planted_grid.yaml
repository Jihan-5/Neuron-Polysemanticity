# E1 — the 24 predeclared configurations (3 sparsity x 2 noise x 2 diversity x 2 sample sizes).
# Full study: reps=500. Pilot (labelled as such in outputs): reps=20 dev_reps=10 pilot=true.
extends: base.yaml
experiment: e1_planted_grid
reps: 500
dev_reps: 50          # development datasets: only for score->count calibration maps
pilot: false
grid:
  rate_center: [0.05, 0.15, 0.30]
  noise_rel_sd: [0.05, 0.20]
  diversity: [well_separated, near_collinear]
  n_per_env: [2000, 5000]
methods:
  moments: {}
  gmm_bic: {k_max: 6, max_rows: 4000}
  dpmi_style: {k_max: 8, max_rows: 3000}
  pca: {}
  factor_analysis: {rotation: varimax}
  fastica: {}
  dict_learning: {alpha: 0.1, max_iter: 30}
  jointdiag: {n_starts: 6}
  jointdiag_cum: {n_starts: 6}     # exploratory: + 4th-order cumulant slices (higher-moment info set)
  boot_percentile: {n_boot: 200}
  sensitivity: {n_restarts: 24, n_perturb: 10}
  ismb: {n_boot: 200, alpha: 0.05}
