# E13 — out-of-sample check of ismb_cum_v2 (cumulant stack + overcompleteness gate + stability
# widening + dependence tests on ambiguous pairs). Its fixes were designed on E11's failing
# datasets, so this run uses a NEW seed: fresh datasets, both methods on the same datasets.
# Ten of E11's conditions: the four where ismb_cum missed, five clean or hard ones for the
# width cost, and overcomplete_24.
extends: base.yaml
experiment: e11_cumulant_ismb
seed: 20261023
reps: 100
dev_reps: 0
methods:
  ismb_cum: {n_boot: 200, alpha: 0.05}
  ismb_cum_v2: {n_boot: 200, alpha: 0.05}
conditions:
  clean: {}
  weak_diversity: {diversity: near_collinear, collinear_eta: 0.05}
  collinear_pair:
    collinear_groups:
    - [0, 1]
  few_envs_3: {n_envs: 3}
  cooccurrence_perfect:
    switch_corr_blocks:
    - [0, 1]
    switch_corr: 1.0
  loadings_near_tau: {near_tau_columns: 6, near_tau_width: 0.02}
  noise_correlated_stationary: {noise_mode: correlated_stationary, noise_rel_sd: 0.2}
  noise_student_t: {noise_mode: student_t, noise_rel_sd: 0.2}
  gaussianity_0.9: {latent_gaussianity: 0.9}
  overcomplete_24: {K: 24, max_cond: 1.0e9}
